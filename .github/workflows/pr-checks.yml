name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Size check
  size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          SOUNDCLOUD_CLIENT_ID: dummy_client_id
          JWT_SECRET: dummy_jwt_secret
      
      - name: Analyze bundle
        run: |
          echo "📦 Build size analysis:"
          du -sh .next
          echo ""
          echo "📄 Page sizes:"
          find .next/static -name "*.js" -exec ls -lh {} \; | awk '{print $5, $9}' | sort -hr | head -20
  
  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
  
  # Code quality
  quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for console.log statements
        run: |
          echo "🔍 Checking for console.log statements (should use logger instead)..."
          if grep -r "console\.log\|console\.warn" src/ --exclude-dir=node_modules --include="*.ts" --include="*.tsx" | grep -v "logger.ts" | grep -v "test.ts"; then
            echo "⚠️ Found console.log statements. Please use the logger utility instead."
            exit 1
          else
            echo "✅ No console.log statements found."
          fi
        continue-on-error: true
      
      - name: Check test coverage threshold
        run: |
          npm run test:ci
          COVERAGE=$(cat coverage/coverage-final.json | node -pe "const data = JSON.parse(require('fs').readFileSync(0)); let total = 0, covered = 0; Object.values(data).forEach(file => { total += file.lines.total; covered += file.lines.covered; }); ((covered/total)*100).toFixed(2)")
          echo "📊 Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 20" | bc -l) )); then
            echo "⚠️ Coverage is below 20%. Please add more tests."
          else
            echo "✅ Coverage threshold met."
          fi

